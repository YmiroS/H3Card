<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目组 · 抽卡系统</title><link rel="icon" type="image/png" href="/favicon.png?v=ck05"><link rel="stylesheet" href="/admin-shell.css">
<style>
.teams-page .page-status:empty,.teams-page [role=alert]:empty{display:none}.teams-page .page-status{padding:14px 20px;border:1px solid #6f3e4b;background:#24171d;border-radius:10px;color:#fda4b4;overflow-wrap:anywhere}.teams-page .team-list{display:grid;gap:var(--gap)}.teams-page .team-header{align-items:start}.teams-page .team-title{display:grid;gap:7px;min-width:0}.teams-page .team-title h2{overflow-wrap:anywhere}.teams-page .team-title .f-chip{justify-self:start}.teams-page .team-count{font-size:13px;color:var(--muted)}.teams-page .team-table{min-width:720px}.teams-page .perm-identity{display:grid;gap:3px;overflow-wrap:anywhere}.teams-page .perm-username{font-weight:550}.teams-page .perm-user-id{font-size:12px;color:var(--muted)}.teams-page .f-chip.on{color:#7bd99d;border-color:#355d43;background:#19281f}.teams-page .f-chip.off{color:#fb7185;border-color:#6d3541;background:#2c1b22}.teams-page .team-card .table-wrap{max-height:520px;scrollbar-gutter:stable}.teams-page .team-table th{position:sticky;top:0;background:var(--panel);z-index:1}.teams-page .team-picker{margin:0 24px 20px;border:1px solid var(--soft-line);border-radius:8px;background:var(--surface)}.teams-page .team-picker>summary{padding:12px 16px;color:#dce2ec;font-size:14px;cursor:pointer;min-height:44px}.teams-page .team-picker[open]>summary{border-bottom:1px solid var(--soft-line)}.teams-page .team-add-member{padding:16px;display:grid;gap:14px}.teams-page .team-member-picker{border:0;padding:0;margin:0;min-width:0}.teams-page .team-member-picker legend{font-size:13px;color:var(--muted);padding:0 0 12px}.teams-page .team-member-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:10px}.teams-page .team-member-toolbar label{display:flex;gap:9px;align-items:center;min-height:36px;cursor:pointer}.teams-page .team-member-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));max-height:240px;overflow:auto;gap:6px 12px}.teams-page .team-member-option{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 12px;border:1px solid var(--soft-line);border-radius:6px;font-size:13px;cursor:pointer}.teams-page .team-member-option:hover{background:var(--hover)}.teams-page .team-member-option:has(input:checked){border-color:#45657a;background:#182630}.teams-page .team-member-option input{flex:0 0 18px;margin:0;padding:0}.teams-page .team-member-option span{overflow-wrap:anywhere;min-width:0}.teams-page .team-add-member>button{justify-self:start}.teams-page .team-member-error{font-size:13px;color:var(--red);overflow-wrap:anywhere}.teams-page .readonly-note{font-size:13px;color:var(--muted);max-width:420px}.teams-page .refresh-note{font-size:12px;color:var(--muted)}.teams-page .create-team-form [role=alert]{grid-column:1/-1}.teams-page .dialog-member-list{max-height:240px;overflow:auto;margin:0;padding-left:24px}.teams-page .dialog-member-list li{overflow-wrap:anywhere;padding:4px 0}
@media(max-width:767px){.teams-page .team-picker{margin:0 18px 18px}.teams-page .team-member-choices{grid-template-columns:1fr}.teams-page .team-header{gap:14px}.teams-page .header-actions{width:100%}}
</style></head>
<body class="admin-page teams-page" data-workspace="teams">
<main id="main" tabindex="-1"><div class="page">
<header class="card page-header"><div><h1>项目组</h1><div class="page-caption"><p class="subtitle">项目组空间中的画布由组员共同查看和编辑</p></div></div><div class="header-actions"><span id="refresh-note" class="refresh-note" role="status">正在加载真实数据…</span><button id="refresh" type="button" disabled>刷新数据</button></div></header>
<p id="error" class="page-status" role="alert"></p>
<section id="create-section" class="card teams-new" aria-labelledby="create-heading" hidden><h2 id="create-heading">新建项目组</h2><form id="create-team" class="create-team-form"><label class="field">项目组名称（最多 64 字）<input name="name" maxlength="64" required autocomplete="off" placeholder="例如：漫剧制作二组"></label><button id="create-submit" class="primary" disabled>创建项目组</button><p id="create-error" class="danger small" role="alert"></p></form><p id="create-help" class="form-help">创建者自动成为组长和首位成员。</p></section>
<section aria-labelledby="teams-heading"><div class="section-heading"><h2 id="teams-heading">项目组与组员</h2><span id="team-count" class="team-count" role="status"></span></div><div id="team-list" class="team-list"><div class="card empty-state">正在加载项目组…</div></div></section>
</div></main>
<script src="/auth.js"></script><script src="/admin-shell.js"></script><script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
let teams = [], candidates = [], currentUser = null, loading = false, mutationBusy = false, ready = false, candidatesReady = false;
const expandedTeams = new Set();
const h = value => AdminUI.escape(String(value ?? ''));
const cell = (row, value) => { const td = document.createElement('td'); td.textContent = value; row.append(td); return td; };
const label = user => user.username + '（ID: ' + user.id + '）';
function identity(user) {
  const wrap = document.createElement('span'); wrap.className = 'perm-identity';
  const name = document.createElement('span'); name.className = 'perm-username'; name.textContent = user.username;
  const meta = document.createElement('span'); meta.className = 'perm-user-id'; meta.textContent = 'ID: ' + user.id;
  wrap.append(name, meta); return wrap;
}
function chip(text, cls = '') { const node = document.createElement('span'); node.className = 'f-chip ' + cls; node.textContent = text; return node; }
function syncControls() {
  $('refresh').disabled = loading || mutationBusy || !currentUser;
  $('create-submit').disabled = loading || mutationBusy || !ready;
  for (const node of document.querySelectorAll('[data-remove-member]')) node.disabled = loading || mutationBusy || !ready;
}
async function refresh() {
  if (loading) return;
  loading = true; syncControls(); $('refresh-note').textContent = '正在加载真实数据…';
  try {
    const [teamResult, candidateResult] = await Promise.allSettled([H3Auth.request('/api/teams'), H3Auth.request('/api/team-candidates')]);
    if (teamResult.status === 'rejected') throw teamResult.reason;
    teams = teamResult.value.teams; ready = true; candidatesReady = candidateResult.status === 'fulfilled';
    candidates = candidatesReady ? candidateResult.value.users : [];
    if (!candidatesReady) $('error').textContent = '项目组已加载，但候选账号加载失败，暂不可添加组员。请刷新重试：' + candidateResult.reason.message;
    render(); $('refresh-note').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  } catch (error) { ready = false; $('refresh-note').textContent = '加载失败，请刷新重试'; throw error; }
  finally { loading = false; syncControls(); }
}
async function changed(message) {
  AdminUI.toast(message);
  try { await refresh(); } catch (error) { $('error').textContent = '操作已成功，但项目组刷新失败，请点击刷新数据后继续：' + error.message; }
}
function openOperation({title, body, submitLabel, action, message}) {
  if (mutationBusy || !ready) return;
  return AdminUI.dialog({title, body, submitLabel, onSubmit:async form => {
    if (mutationBusy) throw new Error('另一项操作正在提交，请稍后重试。');
    mutationBusy = true; syncControls(); $('error').textContent = '';
    try { await action(form); await changed(message); }
    finally { mutationBusy = false; syncControls(); }
  }});
}
function memberPicker(team) {
  const details = document.createElement('details'); details.className = 'team-picker'; details.open = expandedTeams.has(team.id);
  const summary = document.createElement('summary'); summary.textContent = '添加组员 · 批量选择'; details.append(summary);
  details.ontoggle = () => { if (details.open) expandedTeams.add(team.id); else expandedTeams.delete(team.id); };
  const form = document.createElement('form'); form.className = 'team-add-member';
  const field = document.createElement('fieldset'); field.className = 'team-member-picker';
  const caption = document.createElement('legend'); caption.textContent = '从已启用且审批通过的候选账号中添加（最多 1000 人）'; field.append(caption);
  const toolbar = document.createElement('div'); toolbar.className = 'team-member-toolbar';
  const allLabel = document.createElement('label'), all = document.createElement('input'); all.type = 'checkbox'; allLabel.append(all, document.createTextNode('全选'));
  const count = document.createElement('span'); count.setAttribute('role', 'status'); toolbar.append(allLabel, count); field.append(toolbar);
  const choices = document.createElement('div'); choices.className = 'team-member-choices';
  const memberIds = new Set(team.members.map(member => String(member.id))), inputs = [];
  const available = candidates.filter(user => user.enabled && (!user.approval_status || user.approval_status === 'approved') && !memberIds.has(String(user.id)));
  for (const user of available) {
    const option = document.createElement('label'); option.className = 'team-member-option';
    const input = document.createElement('input'); input.type = 'checkbox'; input.value = user.id;
    const name = document.createElement('span'); name.textContent = user.username + (user.display_name ? '（' + user.display_name + '）' : '');
    option.append(input, name); choices.append(option); inputs.push(input);
  }
  if (!inputs.length) { const empty = document.createElement('p'); empty.className = 'muted small'; empty.textContent = candidatesReady ? '暂无可添加的组员' : '候选账号加载失败，请点击刷新数据重试'; choices.append(empty); }
  field.append(choices);
  const submit = document.createElement('button'); submit.className = 'primary';
  const error = document.createElement('p'); error.className = 'team-member-error'; error.setAttribute('role', 'alert');
  let busy = false;
  const sync = () => {
    const selected = inputs.filter(input => input.checked).length;
    count.textContent = '已选 ' + selected + ' 人'; all.checked = inputs.length > 0 && selected === inputs.length; all.indeterminate = selected > 0 && selected < inputs.length;
    all.disabled = busy || !inputs.length; submit.disabled = busy || !selected || !ready;
    submit.textContent = busy ? '添加中…' : selected ? '添加 ' + selected + ' 名组员' : '添加所选组员';
  };
  for (const input of inputs) input.onchange = sync;
  all.onchange = () => { for (const input of inputs) input.checked = all.checked; sync(); };
  form.append(field, submit, error); details.append(form); sync();
  form.onsubmit = event => {
    event.preventDefault(); if (busy || mutationBusy || !ready) return;
    const userIds = inputs.filter(input => input.checked).map(input => input.value);
    if (!userIds.length) return;
    if (userIds.length > 1000) { error.textContent = '每次最多添加 1000 名组员，请减少选择。'; return; }
    const selected = available.filter(user => userIds.includes(String(user.id)));
    openOperation({title:'确认添加 ' + selected.length + ' 名组员', body:`<p>项目组：<b>${h(team.name)}</b></p><ul class="dialog-member-list">${selected.map(user => '<li>' + h(label(user)) + '</li>').join('')}</ul><p class="notice-box">添加后这些账号可共同查看和编辑本组空间的全部画布、任务和素材。不会创建账号或发送邀请。</p>`, submitLabel:'确认添加组员', action:async () => {
      if (!team.can_manage) throw new Error('你无权管理该项目组。');
      busy = true; field.disabled = true; form.setAttribute('aria-busy', 'true'); error.textContent = ''; sync();
      try { await H3Auth.json('/api/teams/' + encodeURIComponent(team.id) + '/members/batch', 'POST', {user_ids:userIds}); }
      catch (failure) { error.textContent = failure.message; throw failure; }
      finally { busy = false; field.disabled = false; form.removeAttribute('aria-busy'); sync(); }
    }, message:'已添加 ' + selected.length + ' 名组员'});
  };
  return details;
}
function render() {
  const list = $('team-list'); list.replaceChildren();
  $('team-count').textContent = teams.length + ' 个项目组 · ' + teams.filter(team => team.can_manage).length + ' 个可管理';
  for (const team of teams) {
    const card = document.createElement('article'); card.className = 'card team-card';
    const header = document.createElement('header'); header.className = 'team-header';
    const title = document.createElement('div'); title.className = 'team-title';
    const heading = document.createElement('h2'); heading.textContent = team.name;
    const meta = document.createElement('p'); meta.className = 'section-subtitle'; meta.textContent = '组长 ' + team.leader_username + ' · ' + team.members.length + ' 名成员';
    title.append(heading, meta, chip(team.can_manage ? '可管理' : '只读 / 无管理权限')); header.append(title);
    if (!team.can_manage) { const note = document.createElement('p'); note.className = 'readonly-note'; note.textContent = '你是本组组员，仅可查看成员；不能添加或移除组员。项目组画布仍按成员关系共同编辑。'; header.append(note); }
    card.append(header);
    if (team.can_manage) card.append(memberPicker(team));
    const scroll = document.createElement('div'); scroll.className = 'table-wrap'; scroll.tabIndex = 0; scroll.setAttribute('role', 'region'); scroll.setAttribute('aria-label', team.name + '成员列表');
    const table = document.createElement('table'); table.className = 'team-table'; table.innerHTML = '<thead><tr><th scope="col">账号 / ID</th><th scope="col">姓名 / 花名</th><th scope="col">组内身份</th><th scope="col">账号状态</th><th scope="col">操作</th></tr></thead>';
    const body = document.createElement('tbody');
    for (const member of team.members) {
      const leader = String(member.id) === String(team.leader_id), row = document.createElement('tr');
      cell(row, '').append(identity(member)); cell(row, member.display_name || '—'); cell(row, '').append(chip(leader ? '组长' : '组员'));
      cell(row, '').append(chip(member.enabled ? '启用' : '已停用', member.enabled ? 'on' : 'off'));
      const actions = cell(row, '');
      if (leader || !team.can_manage) { actions.textContent = leader ? '不可移除组长' : '只读'; actions.className = 'muted small'; }
      else {
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'danger'; remove.textContent = '移除'; remove.dataset.removeMember = '';
        remove.onclick = () => openOperation({title:'确认移除组员', body:`<p>项目组：<b>${h(team.name)}</b></p><p>移除账号：${h(label(member))}</p><p class="notice-box danger">该账号将立即失去本组画布、任务和素材的访问权限。此操作不删除账号，不改变个人画布归属。组长不可移除。</p>`, submitLabel:'确认移除组员', action:() => {
          if (!team.can_manage || String(member.id) === String(team.leader_id)) throw new Error('无权移除此成员。');
          return H3Auth.request('/api/teams/' + encodeURIComponent(team.id) + '/members/' + encodeURIComponent(member.id), {method:'DELETE'});
        }, message:'组员已移除'}); actions.append(remove);
      }
      body.append(row);
    }
    if (!team.members.length) { const row = document.createElement('tr'); cell(row, '暂无成员，请刷新项目组信息。').colSpan = 5; body.append(row); }
    table.append(body); scroll.append(table); card.append(scroll);
    const note = document.createElement('p'); note.className = 'table-note'; note.textContent = '移除组员后，该账号立即失去本组画布、任务和素材的访问权限。添加仅限已启用且审批通过的已有候选账号。'; card.append(note); list.append(card);
  }
  if (!teams.length) { const empty = document.createElement('div'); empty.className = 'card empty-state'; const title = document.createElement('b'); title.textContent = '暂无项目组'; const text = document.createElement('p'); text.textContent = '创建项目组后，可从已有候选账号批量添加组员。'; empty.append(title, text); list.append(empty); }
  syncControls();
}
$('create-team').onsubmit = event => {
  event.preventDefault(); const source = event.currentTarget, name = source.elements.name.value.trim();
  $('create-error').textContent = '';
  if (!name || Array.from(name).length > 64 || /[\u0000-\u001f]/u.test(name)) { $('create-error').textContent = '项目组名称须为 1 至 64 个字符，不能含控制字符。'; return; }
  openOperation({title:'确认创建项目组', body:`<p>项目组：<b>${h(name)}</b></p><p>创建者：${h(label(currentUser))}</p><p class="notice-box">创建者自动成为组长和首位成员。本组全部画布由组员共同查看和编辑。</p>`, submitLabel:'确认创建项目组', action:async () => { await H3Auth.json('/api/teams', 'POST', {name}); source.reset(); }, message:'项目组已创建'});
};
$('refresh').onclick = async () => { $('error').textContent = ''; try { await refresh(); } catch (error) { $('error').textContent = error.message; } };
H3Auth.requireUser().then(async user => {
  await AdminUI.mount({page:'teams', user});
  if (user.role !== 'admin' && !user.team_leader) throw new Error('仅管理员或组长可访问项目组管理。');
  currentUser = user; $('create-section').hidden = false;
  $('create-help').textContent = '创建者 ' + user.username + ' 自动成为组长和首位成员。项目组画布由组员共同编辑。';
  await refresh();
}).catch(error => { $('error').textContent = error.message; });
})();
</script></body></html>
