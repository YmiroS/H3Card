<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽卡系统</title>
<!-- 浏览器标签页的图标。favicon.png 是 64²、icon.png 是 256²（加到主屏幕/书签用大的那张） -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="canvas-studio">

<!-- ---------- 左侧项目栏 ---------- -->
<aside id="side" aria-label="画布项目">
  <div class="head">
    <span class="brand-mark" aria-hidden="true"><img src="icon.png" alt="" class="logo" draggable="false"></span>
    <span class="brand-copy"><b>Chouka</b><small>CREATIVE CANVAS</small></span>
    <a class="dot" id="dot" title="ComfyUI 连接状态" aria-label="ComfyUI 连接状态"></a>
  </div>
  <button id="newproj"><span aria-hidden="true">＋</span><span>新建项目</span></button>
  <div class="section-label">我的画布</div>
  <div id="plist"></div>
  <div class="side-foot"><span class="side-foot-dot"></span>本地工作区</div>
</aside>

<!-- ---------- 主区 ---------- -->
<main id="main">
  <div id="topbar" aria-label="画布工具栏">
    <button class="tbtn icon-btn" id="toggle" title="收起/展开项目栏" aria-label="收起或展开项目栏">☰</button>
    <span class="crumb">画布</span><span class="crumb-sep">/</span>
    <span id="ptitle"></span>
    <button class="tbtn" id="fit" style="display:none">适应视图</button>
    <span id="hint"></span>
    <button class="tbtn" id="jobsbtn" title="查看所有任务">任务</button>
  </div>

  <div id="stage">
    <svg id="wires"></svg>
    <div id="groups"></div>
    <div id="world"></div>
    <div id="lasso" style="display:none"></div>
    <div id="selbar" style="display:none"></div>
    <div id="panel" style="display:none"></div>
    <div id="dock" style="display:none"></div>
    <div id="canvas-toolbar" aria-label="视图控制">
      <button id="minimap-btn" class="toolbar-btn" title="小地图" aria-label="打开小地图">▦</button>
      <button id="wires-toggle" class="toolbar-btn" title="显示/隐藏连线" aria-label="显示或隐藏连线">⌁</button>
      <button id="zoom-menu" class="toolbar-btn" title="缩放"><span id="zoom-percent">100%</span></button>
    </div>
    <div id="minimap" style="display:none">
      <canvas id="minimap-canvas"></canvas>
      <div id="minimap-viewport"></div>
    </div>
  </div>

  <div id="empty">
    <div class="empty-icon" aria-hidden="true">◇</div>
    <div class="big">开始一张新的创作画布</div>
    <div class="empty-copy">组合图片、视频与文本节点，把每一次生成变成可复用的工作流。</div>
    <div class="cta">
      <button id="createHere"><span aria-hidden="true">＋</span> 新建画布</button>
    </div>
    <div class="empty-shortcuts"><span>中键拖动画布</span><span>滚轮缩放</span><span>拖动端口连接节点</span></div>
  </div>
</main>

<!-- ---------- 右侧历史产物栏 ---------- -->
<aside id="hist" style="display:none"></aside>

<div id="jobs" style="display:none"></div>
<div id="respop" style="display:none"></div>
<div id="view" style="display:none"><div class="vbox"></div></div>
<div id="menu" style="display:none"></div>
<div id="tip" style="display:none"></div>
<div id="toast"></div>
<input type="file" id="picker" style="display:none">

<script src="app.js"></script>
</body>
</html>
