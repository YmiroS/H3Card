<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽卡系统</title>
<!-- 浏览器标签页的图标。favicon.png 是 64²、icon.png 是 256²（加到主屏幕/书签用大的那张） -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- 左侧项目栏 ---------- -->
<aside id="side">
  <div class="head">
    <img src="icon.png" alt="" class="logo" draggable="false">
    <b>抽卡系统</b>
    <span class="dot" id="dot" title="ComfyUI 连接状态"></span>
  </div>
  <button id="newproj">＋ 新建项目</button>
  <div id="plist"></div>
</aside>

<!-- ---------- 主区 ---------- -->
<main id="main">
  <div id="topbar">
    <button class="tbtn" id="toggle" title="收起/展开项目栏">☰</button>
    <span id="ptitle"></span>
    <button class="tbtn" id="fit" style="display:none">复位视图</button>
    <span id="hint"></span>
    <button class="tbtn" id="jobsbtn" title="查看所有任务">任务</button>
  </div>

  <div id="stage">
    <svg id="wires"></svg>
    <div id="groups"></div>
    <div id="world"></div>
    <div id="lasso" style="display:none"></div>
    <div id="selbar" style="display:none"></div>
    <div id="dock" style="display:none"></div>
  </div>

  <div id="empty">
    <div class="big">还没有打开画布</div>
    <div class="cta">
      <button id="createHere">＋ 新建画布创作</button>
    </div>
    <div style="font-size:12px">新建节点用底部「上传 / 文本 / 图片 / 视频 / 工具箱」那条，节点建在视野正中 · 左键拖空白框选节点（选中后可打组）· 鼠标中键拖动画布 · 滚轮缩放 · 双击节点产物看大图 · 拖右侧圆点连线传产物</div>
  </div>
</main>

<!-- ---------- 右侧历史产物栏 ---------- -->
<aside id="hist" style="display:none"></aside>

<div id="jobs" style="display:none"></div>
<div id="panel" style="display:none"></div>
<div id="respop" style="display:none"></div>
<div id="view" style="display:none"><div class="vbox"></div></div>
<div id="menu" style="display:none"></div>
<div id="tip" style="display:none"></div>
<div id="toast"></div>
<input type="file" id="picker" style="display:none">

<script src="app.js"></script>
</body>
</html>
