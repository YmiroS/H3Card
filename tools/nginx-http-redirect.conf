# Install as /etc/nginx/sites-available/chouka-http-redirect.
# Enable it in sites-enabled instead of the packaged default site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dinghaichouka.youku.com;
    add_header Cache-Control "no-store" always;
    return 302 http://dinghaichouka.youku.com:8199$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name dinghaichouka.youku.com;
    ssl_certificate /home/dinghai/.config/chouka-https-8443/server.crt;
    ssl_certificate_key /home/dinghai/.config/chouka-https-8443/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Clear the old HTTPS session so its Secure cookie cannot block HTTP login.
    add_header Set-Cookie "h3card_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "h3card_session_v2=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    return 302 http://dinghaichouka.youku.com:8199$request_uri;
}
